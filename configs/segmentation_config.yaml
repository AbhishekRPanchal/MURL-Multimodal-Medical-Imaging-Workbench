experiment_name: "breast_ultrasound_segmentation"
seed: 42
data:
  metadata_path: "data/processed/dataset_metadata.json"
  image_size: [256, 256]
  in_channels: 1
  out_channels: 1
  batch_size: 8
  num_workers: 0

training:
  epochs: 15
  learning_rate: 0.0005
  weight_decay: 0.0001
  loss: "MONAI_DiceCELoss"
  sigmoid: true
  scheduler: "CosineAnnealingLR"
  output_dir: "checkpoints/segmentation"

model:
  framework: "Project-MONAI"
  architecture: "UNet"
  spatial_dims: 2
  in_channels: 1
  out_channels: 1
  channels: [16, 32, 64, 128]
  strides: [2, 2, 2]
  num_res_units: 1
  dropout: 0.2
