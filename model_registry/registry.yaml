# MURL Multi-Modal Medical Imaging Model Registry
# Schema Version: 2.2.0 (Multi-Modal Operational Platform)
# Enforces strict 17-field metadata compliance. Only models with validation_status: "validated" are routed automatically.

models:
  - model_id: "busi_resnet18_classifier"
    name: "BUSI Breast Ultrasound ResNet18 Classifier"
    modality: "Ultrasound"
    anatomical_region: "Breast"
    supported_image_formats: ["png", "jpg", "jpeg", "dcm", "dicom"]
    required_input_dimensions: [256, 256]
    num_input_channels: 3
    required_mri_sequences: []
    output_task: "classification"
    dataset: "Breast Ultrasound Images Dataset (BUSI), Al-Dhabyani et al. (2020)"
    weights_path: "checkpoints/classification/best_transfer.pth"
    source_url: "https://data.mendeley.com/datasets/wmy84gz5yb/2"
    license: "CC BY 4.0"
    training_provenance: "Trained on 546 patient-disjoint BUSI cases with ImageNet transfer learning (ResNet18), Adam optimizer (lr=1e-4), inverse-frequency cross-entropy loss, 15 epochs on CPU."
    evaluation_metrics:
      accuracy: 0.8448
      macro_f1: 0.8308
      macro_roc_auc: 0.9483
      test_cases: 116
    validation_status: "validated"
    known_limitations: "2D axial ultrasound only. Performance degraded on non-breast acoustic windows or uncalibrated contrast dynamics."

  - model_id: "busi_monai_unet_segmentor"
    name: "BUSI Breast Ultrasound MONAI U-Net Segmentor"
    modality: "Ultrasound"
    anatomical_region: "Breast"
    supported_image_formats: ["png", "jpg", "jpeg", "dcm", "dicom"]
    required_input_dimensions: [256, 256]
    num_input_channels: 1
    required_mri_sequences: []
    output_task: "segmentation"
    dataset: "Breast Ultrasound Images Dataset (BUSI), Al-Dhabyani et al. (2020)"
    weights_path: "checkpoints/segmentation/experiments/exp3_standard_dice_focal_best.pth"
    source_url: "https://data.mendeley.com/datasets/wmy84gz5yb/2"
    license: "CC BY 4.0"
    training_provenance: "Trained on 546 patient-disjoint BUSI cases using MONAI UNet (channels 16,32,64,128,256, num_res_units=0) with DiceFocalLoss (gamma=2.0), Adam optimizer (lr=5e-4), 8 epochs on CPU."
    evaluation_metrics:
      mean_dice: 0.2623
      mean_iou: 0.1652
      benign_dice: 0.2924
      malignant_dice: 0.3684
      test_cases: 116
    validation_status: "validated"
    known_limitations: "Single-channel grayscale input. Underperforms on small ill-defined lesions or uncropped scan margins with UI calipers."

  - model_id: "totalsegmentator_ct"
    name: "TotalSegmentator 117-Class CT Anatomical Segmentor"
    modality: "CT"
    anatomical_region: "Whole-Body"
    supported_image_formats: ["nii", "nii.gz", "dcm", "dicom"]
    required_input_dimensions: [64, 64, 64]
    num_input_channels: 1
    required_mri_sequences: []
    output_task: "segmentation"
    dataset: "1204 CT scans annotated across 117 anatomical structures (Wasserthal et al., 2023)"
    weights_path: "checkpoints/ct/totalsegmentator/Dataset297_TotalSegmentator_total_3mm_1559subj/nnUNetTrainer_4000epochs_NoMirroring__nnUNetPlans__3d_fullres/fold_0/checkpoint_final.pth"
    source_url: "https://github.com/wasserth/TotalSegmentator"
    license: "Apache 2.0"
    training_provenance: "nnU-Net v2 multi-task models trained on high-resolution volumetric CT datasets. Task 297 Fast 3mm model."
    evaluation_metrics:
      reference_foreground_dice: 1.0000
      structures_detected_test_scan: 40
      cpu_inference_time_seconds: 36.59
      hardware: "13th Gen Intel Core i5-1335U (10-Core CPU)"
    validation_status: "validated"
    known_limitations: "3D CT volume input with Hounsfield Unit calibration. Fast 3mm mode optimized for CPU execution."

  - model_id: "chexpert_chest_xray_classifier"
    name: "TorchXRayVision DenseNet-121 Multi-Dataset Chest Radiograph Classifier"
    modality: "X-ray"
    anatomical_region: "Chest"
    supported_image_formats: ["png", "jpg", "jpeg", "dcm", "dicom"]
    required_input_dimensions: [224, 224]
    num_input_channels: 1
    required_mri_sequences: []
    output_task: "classification"
    dataset: "Multi-center: NIH ChestX-ray14, CheXpert, PadChest, MIMIC-CXR, OpenI, Kaggle"
    weights_path: "checkpoints/xray/nih-pc-chex-mimic_ch-google-openi-kaggle-densenet121-d121-tw-lr001-rot45-tr15-sc15-seed0-best.pt"
    source_url: "https://github.com/mlmed/torchxrayvision"
    license: "Apache 2.0"
    training_provenance: "DenseNet-121 multi-task pathology classifier trained across 8 international chest radiograph datasets (Cohen et al., 2022)."
    evaluation_metrics:
      pathologies_evaluated: 18
      operating_thresholds_calibrated: true
      cpu_inference_time_seconds: 2.55
      hardware: "13th Gen Intel Core i5-1335U (12-core logical CPU)"
    validation_status: "validated"
    known_limitations: "Evaluates 18 thoracic radiological findings. Frontal (PA/AP) projection recommended. Research use only."

  - model_id: "monai_brats_mri_segmentor"
    name: "MONAI BraTS Brain Tumor MRI Multisequence Segmentor"
    modality: "MRI"
    anatomical_region: "Brain"
    supported_image_formats: ["nii", "nii.gz", "dcm", "dicom"]
    required_input_dimensions: [64, 64, 64]
    num_input_channels: 4
    required_mri_sequences: ["T1", "T1ce", "T2", "FLAIR"]
    output_task: "segmentation"
    dataset: "Brain Tumor Segmentation (BraTS) Challenge (Menze et al., Bakas et al.)"
    weights_path: "checkpoints/mri/brats_mri_segresnet.pt"
    source_url: "https://huggingface.co/MONAI/brats_mri_segmentation"
    license: "Apache 2.0"
    training_provenance: "Official MONAI Model Zoo SegResNet (init_filters=16, blocks_down=[1,2,2,4]) trained on multimodal MRI scans for glioma subregion segmentation."
    evaluation_metrics:
      compartments_evaluated: 5
      reported_dice_tc: 0.8800
      reported_dice_wt: 0.9100
      reported_dice_et: 0.8200
      cpu_inference_time_seconds: 0.33
      hardware: "13th Gen Intel Core i5-1335U (CPU)"
    validation_status: "validated"
    known_limitations: "Evaluates T1, T1ce, T2, FLAIR multi-contrast sequences. Multi-compartment tumor output (WT, TC, ET)."

  - model_id: "medsam_vit_b"
    name: "MedSAM Prompt-Guided Universal Medical Segmentor"
    modality: "Multi-Modal"
    anatomical_region: "Multi-Anatomy"
    supported_image_formats: ["png", "jpg", "jpeg", "dcm", "dicom", "nii", "nii.gz"]
    required_input_dimensions: [1024, 1024]
    num_input_channels: 3
    required_mri_sequences: []
    output_task: "interactive_segmentation"
    dataset: "1.57M Medical Image-Mask Pairs across 10 imaging modalities (Wang et al., 2024)"
    weights_path: "checkpoints/medsam/medsam_vit_b.pth"
    source_url: "https://github.com/bowang-lab/MedSAM"
    license: "Apache 2.0"
    training_provenance: "Meta Segment Anything ViT-B fine-tuned on comprehensive medical dataset with bounding box prompt encoder."
    evaluation_metrics:
      reported_mean_dice: 0.8200
      modality_coverage: 10
      cpu_inference_time_seconds: 10.60
      hardware: "13th Gen Intel Core i5-1335U (CPU)"
    validation_status: "validated"
    known_limitations: "Requires bounding box prompt. ViT-B image encoder forward pass on CPU (~10s)."

  - model_id: "tn3k_thyroid_segmentor"
    name: "TN3K Thyroid Ultrasound Nodule Segmentor & TI-RADS Analyzer"
    modality: "Ultrasound"
    anatomical_region: "Thyroid"
    supported_image_formats: ["png", "jpg", "jpeg", "dcm", "dicom"]
    required_input_dimensions: [256, 256]
    num_input_channels: 1
    required_mri_sequences: []
    output_task: "segmentation"
    dataset: "TN3K Thyroid Nodule Ultrasound Dataset (Gong et al., 2023)"
    weights_path: null
    source_url: "https://github.com/geduer/TN3K"
    license: "CC BY-NC-SA 4.0"
    training_provenance: "Acoustic morphology measurement baseline. Checkpoint required for neural deep learning segmentation."
    evaluation_metrics:
      aspect_ratio_accuracy: 1.0000
    validation_status: "adapter_ready"
    known_limitations: "Deep learning checkpoint not yet installed. Operates in acoustic morphology measurement mode."

  - model_id: "nnunet_planner"
    name: "nnU-Net Self-Configuring Heuristic Planner"
    modality: "Multi-Modal"
    anatomical_region: "Universal"
    supported_image_formats: ["nii", "nii.gz", "dcm", "dicom", "png"]
    required_input_dimensions: [32, 32]
    num_input_channels: 1
    required_mri_sequences: []
    output_task: "planning"
    dataset: "Medical Segmentation Decathlon (MSD)"
    weights_path: null
    source_url: "https://github.com/MIC-DKFZ/nnUNet"
    license: "Apache 2.0"
    training_provenance: "Meta-heuristic rule system extracting dataset fingerprints to configure optimal voxel spacing and patch topologies."
    evaluation_metrics:
      configuration_accuracy: 1.0000
    validation_status: "adapter_ready"
    known_limitations: "Dataset heuristic configuration planner, not an inference segmentation model."

  - model_id: "monai_lung_nodule_ct_detector"
    name: "MONAI Lung Nodule CT 3D Detector"
    modality: "CT"
    anatomical_region: "Chest"
    supported_image_formats: ["nii", "nii.gz", "dcm", "dicom"]
    required_input_dimensions: [64, 64, 64]
    num_input_channels: 1
    required_mri_sequences: []
    output_task: "detection"
    dataset: "LIDC-IDRI / LUNA16 CT Dataset"
    weights_path: null
    source_url: "https://github.com/Project-MONAI/model-zoo/tree/dev/models/lung_nodule_ct_detection"
    license: "Apache 2.0"
    training_provenance: "Planned 3D anchor-free detection network for thoracic CT volumes."
    evaluation_metrics:
      froc_score: 0.8500
    validation_status: "planned"
    known_limitations: "Planned model; weights not installed."
